name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android SIGSYS shim (arm64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          mkdir -p app/src/main/assets/sigsys
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -o app/src/main/assets/sigsys/libsigsys-arm64.so sysguard/sigsys-handler-arm64.c
          ls -la app/src/main/assets/sigsys

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SemCodeAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
