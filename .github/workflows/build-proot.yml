name: build-proot

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-proot.yml'
      - 'app/src/main/java/com/danielsem65/semcodeai/core/LinuxEnv.kt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PRoot 2.3.1 (what the app used to ship) does not translate the statx()
      # syscall. Ubuntu 22.04's glibc is built with __ASSUME_STATX, so every
      # coreutils binary calls statx() and proot lets it reach the Android host
      # kernel with an untranslated guest path. Android has no /usr, /var, /root
      # or /workspace, so every one of those lookups comes back ENOENT and the
      # guest looks completely broken ("ls: cannot access '/usr/bin': No such
      # file or directory"). PRoot >= 5.3 translates statx and fixes it.
      #
      # Bionic/NDK build, not static glibc: Samsung/OneUI seccomp kills static
      # glibc binaries with SIGSYS. Same reason as build-llama.yml.
      - name: Build proot for Android (NDK, all ABIs)
        run: |
          set -euo pipefail
          PROOT_TAG=v5.4.1
          TALLOC_VER=2.4.3
          API=26
          NDK="$ANDROID_NDK_LATEST_HOME"
          NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRC="$RUNNER_TEMP/proot-src"
          PREFIX="$RUNNER_TEMP/prefix"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"

          git clone --recursive --depth 1 --branch "$PROOT_TAG" \
            https://github.com/proot-me/proot.git "$SRC"
          echo "proot checkout: $(git -C "$SRC" describe --tags --always)"

          curl -fsSL -o "$RUNNER_TEMP/talloc.tar.gz" \
            "https://download.samba.org/pub/talloc/talloc-${TALLOC_VER}.tar.gz"
          tar xzf "$RUNNER_TEMP/talloc.tar.gz" -C "$RUNNER_TEMP"

          build_abi() {
            local abi="$1" triple="$2"
            echo "::group::$abi ($triple)"
            local wrap="$RUNNER_TEMP/wrap-$abi"
            local pfx="$PREFIX/$abi"
            mkdir -p "$wrap" "$pfx"

            # The GNUmakefile drives everything through $(CROSS_COMPILE)<tool>,
            # so give it clang/llvm-* behind the expected GNU names.
            ln -sf "$NDKBIN/${triple}${API}-clang"  "$wrap/${triple}-gcc"
            ln -sf "$NDKBIN/llvm-ar"      "$wrap/${triple}-ar"
            ln -sf "$NDKBIN/llvm-ranlib"  "$wrap/${triple}-ranlib"
            ln -sf "$NDKBIN/llvm-strip"   "$wrap/${triple}-strip"
            ln -sf "$NDKBIN/llvm-objcopy" "$wrap/${triple}-objcopy"
            ln -sf "$NDKBIN/llvm-objdump" "$wrap/${triple}-objdump"
            ln -sf "$NDKBIN/ld.lld"       "$wrap/${triple}-ld"

            # talloc must be STATIC: the APK ships only libproot.so, so a
            # dynamic libtalloc.so.2 would be missing at exec time on device.
            (
              cd "$RUNNER_TEMP/talloc-${TALLOC_VER}"
              ./configure \
                --host="$triple" \
                --prefix="$pfx" \
                --disable-shared --enable-static \
                --disable-nls --without-crypto \
                --without-selinux --without-libtdb \
                CC="$wrap/${triple}-gcc" \
                AR="$wrap/${triple}-ar" \
                RANLIB="$wrap/${triple}-ranlib" \
                STRIP="$wrap/${triple}-strip" \
                LD="$wrap/${triple}-gcc" \
                > configure.log 2>&1 || { tail -40 configure.log; exit 1; }
              make -j4 > build.log 2>&1 || { tail -40 build.log; exit 1; }
              make install >> build.log 2>&1 || { tail -40 build.log; exit 1; }
            )

            export PKG_CONFIG_PATH="$pfx/lib/pkgconfig"
            pkg-config --exists talloc || { echo "::error::talloc.pc missing for $abi"; exit 1; }
            echo "talloc cflags: $(pkg-config --cflags talloc)"
            echo "talloc libs:   $(pkg-config --libs talloc)"

            make -C "$SRC/src" clean >/dev/null 2>&1 || true
            make -C "$SRC/src" -j4 \
              CROSS_COMPILE="$wrap/${triple}-" \
              PKG_CONFIG_PATH="$PKG_CONFIG_PATH" > "$RUNNER_TEMP/proot-$abi.log" 2>&1 \
              || { tail -60 "$RUNNER_TEMP/proot-$abi.log"; exit 1; }

            test -f "$SRC/src/proot" || { echo "::error::no proot binary for $abi"; exit 1; }
            cp "$SRC/src/proot" "$OUT/proot-$abi"
            "$NDKBIN/llvm-strip" "$OUT/proot-$abi"
            file "$OUT/proot-$abi" || true
            ls -lh "$OUT/proot-$abi"
            echo "::endgroup::"
          }

          build_abi arm64-v8a   aarch64-linux-android
          build_abi armeabi-v7a arm-linux-androideabi
          build_abi x86_64      x86_64-linux-android

      - name: Smoke-test the binaries
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/out/proot-*; do
            echo "== $f =="
            # A dynamically linked libtalloc would mean the APK breaks on device.
            if readelf -d "$f" | grep -q NEEDED.*talloc; then
              echo "::error::$f still links libtalloc dynamically"; exit 1
            fi
            readelf -h "$f" | grep -E 'Class|Machine'
          done

      - name: Upload proot binaries
        uses: actions/upload-artifact@v4
        with:
          name: proot-android
          path: ${{ runner.temp }}/out/proot-*

      # Android only allows exec() from the native library dir, so each binary
      # ships as a fake JNI lib (same pattern as libproot.so has always used).
      - name: Commit binaries into repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$RUNNER_TEMP/out/proot-$abi"
            size=$(stat -c%s "$src")
            echo "$abi: $size bytes"
            if [ "$size" -gt 99000000 ]; then echo "::error::$abi binary too large for git"; exit 1; fi
            dst="app/src/main/jniLibs/$abi/libproot.so"
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst"
            git add "$dst"
            changed=1
          done
          if [ "$changed" = 1 ]; then
            git commit -m "chore: rebuild libproot.so from PRoot 5.4.1 with the Android NDK (statx support)" || echo "no changes"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi