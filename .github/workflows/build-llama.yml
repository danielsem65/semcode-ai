name: build-llama

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve latest llama.cpp tag
        id: tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building llama.cpp $TAG"

      - name: Build static llama-server (linux/arm64)
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 -v "$PWD/out:/out" ubuntu:22.04 bash -exc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y git cmake g++ file ca-certificates
            git clone --depth 1 --branch '"${{ steps.tag.outputs.tag }}"' https://github.com/ggml-org/llama.cpp /src
            cmake -S /src -B /build \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLAMA_CURL=OFF \
              -DGGML_OPENMP=OFF \
              -DGGML_NATIVE=OFF \
              -DGGML_BACKEND_DL=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=ON \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_EXE_LINKER_FLAGS="-static"
            cmake --build /build --target llama-server -j4
            cp /build/bin/llama-server /out/llama-server
            file /out/llama-server || true
            ls -lh /out
          '

      - name: Commit binary into repo
        run: |
          ls -lh out/
          SIZE=$(stat -c%s out/llama-server)
          echo "binary size: $SIZE bytes"
          if [ "$SIZE" -gt 99000000 ]; then echo "::error::binary too large for git ($SIZE)"; exit 1; fi
          # Android only allows exec from the native library dir, so the binary
          # ships as a fake JNI lib (same pattern as libproot.so).
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp out/llama-server app/src/main/jniLibs/arm64-v8a/libllama-server.so
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs/arm64-v8a/libllama-server.so
          git commit -m "add static llama-server (linux/arm64) ${{ steps.tag.outputs.tag }} as libllama-server.so" || echo "no changes"
          git push origin main
