name: build-llama

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest llama.cpp tag
        id: tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building llama.cpp $TAG"

      # Bionic (NDK) build instead of static glibc: Samsung/OneUI seccomp kills
      # static glibc binaries with SIGSYS. NDK binaries use the same libc every
      # Android app process uses, so they always pass.
      - name: Build llama-server for Android arm64 (NDK)
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp src
          cmake -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DLLAMA_CURL=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target llama-server -j4
          mkdir -p out
          cp build/bin/llama-server out/llama-server
          # Strip debug symbols — unstripped NDK binaries are ~170 MB.
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" out/llama-server
          file out/llama-server || true
          ls -lh out/

      - name: Upload artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-android-arm64
          path: out/llama-server

      - name: Commit binary into repo
        run: |
          SIZE=$(stat -c%s out/llama-server)
          echo "binary size: $SIZE bytes"
          if [ "$SIZE" -gt 99000000 ]; then echo "::error::binary too large for git ($SIZE)"; exit 1; fi
          # Android only allows exec from the native library dir, so the binary
          # ships as a fake JNI lib (same pattern as libproot.so).
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp out/llama-server app/src/main/jniLibs/arm64-v8a/libllama-server.so
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs/arm64-v8a/libllama-server.so
          git commit -m "rebuild libllama-server.so with Android NDK (${{ steps.tag.outputs.tag }}, bionic)" || echo "no changes"
          git fetch origin main
          git rebase origin/main
          git push origin main
